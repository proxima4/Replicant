# Builds the Replicant VST3 (and standalone app) for Windows every time
# you push changes to GitHub. Download the result from the Actions tab.
name: Build Replicant (Windows)

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'INSTALL.txt' ]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure (downloads JUCE automatically)
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --target Replicant_VST3 Replicant_Standalone --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "build/Replicant_artefacts/Release/VST3/Replicant.vst3" package/
          Copy-Item "build/Replicant_artefacts/Release/Standalone/Replicant.exe" package/
          Copy-Item INSTALL.txt package/
          Copy-Item -Recurse Resources/fonts/OFL-*.txt package/

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: Replicant-Windows
          path: package/
          retention-days: 30
